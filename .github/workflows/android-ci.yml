name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, lint, and analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Generate debug keystore
        run: |
          if [[ ! -f debug.keystore ]]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build and Run Checks
        run: |
          chmod +x gradlew
          ./gradlew --continue --stacktrace --warning-mode all \
            ktlintCheck \
            detekt \
            lintDebug \
            testDebugUnitTest \
            assembleDebug

      - name: Upload APK and Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sobji-dokan-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/
          if-no-files-found: warn
          retention-days: 14
